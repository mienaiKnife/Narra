name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          IFS='.' read -r major minor patch <<< "${TAG%%-*}"
          major=${major:-0}
          minor=${minor:-0}
          patch=${patch:-0}
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing ${name} repository secret" >&2
              exit 1
            fi
          done
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.keystore"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew assembleRelease

      - name: Prepare release artifacts
        run: |
          APK="narra-${GITHUB_REF_NAME}.apk"
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "Signed release APK not found. Outputs:" >&2
            ls -la app/build/outputs/apk/release/ >&2
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "${APK}"
          sha256sum "${APK}" > "${APK}.sha256"
          ls -lh "${APK}" "${APK}.sha256"

      - name: Verify APK signature and version
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          APK="narra-${GITHUB_REF_NAME}.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "${APK}"

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging "${APK}" | grep '^package:')
          echo "${BADGING}"
          echo "${BADGING}" | grep -q "versionCode='${VERSION_CODE}'"
          echo "${BADGING}" | grep -q "versionName='${VERSION_NAME}'"

          UNZIP_ENTRIES="${RUNNER_TEMP}/apk-entries.txt"
          unzip -Z1 "${APK}" > "${UNZIP_ENTRIES}"

          if grep -Eq '^lib/x86(_64)?/' "${UNZIP_ENTRIES}"; then
            echo "Release APK unexpectedly contains x86 native libraries" >&2
            exit 1
          fi

          for abi in arm64-v8a armeabi-v7a; do
            if ! grep -q "^lib/${abi}/" "${UNZIP_ENTRIES}"; then
              echo "Release APK is missing ${abi} native libraries" >&2
              exit 1
            fi
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="narra-${GITHUB_REF_NAME}.apk"
          NOTES_ARGS=(--generate-notes)
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "${NOTES_FILE}" ]; then
            NOTES_ARGS=(--notes-file "${NOTES_FILE}")
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${APK}" "${APK}.sha256" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${APK}" "${APK}.sha256" \
              --title "${GITHUB_REF_NAME}" \
              "${NOTES_ARGS[@]}"
          fi
